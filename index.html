<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المنسي لخدمات البلايستيشن والموبايل - تعديلة إصدار سوفت وير 9</title>
  <style>
    :root {
      --bg-card: rgba(20, 18, 15, 0.93);
      --console-bg: #080706;
      --border: rgba(245, 158, 11, 0.28);
      --accent-soft: rgba(245, 158, 11, 0.14);
      --text-main: #fafaf9;
      --text-muted: #a8a29e;
      --accent-gold: #fbbf24;
      --accent-copper: #d97706;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @font-face {
      font-family: 'logging';
      src: url('fonts/LiberationMono-Regular.ttf');
      font-display: swap;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(180, 83, 9, 0.24), rgba(12, 11, 9, 0.94) 55%),
        url('icon0 (1).jpg') center / cover no-repeat fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 18px;
      overflow: hidden;
    }

    .shell {
      width: 100%;
      max-width: 800px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.65);
      padding: 22px 24px;
    }

    .brand-header {
      text-align: center;
      padding-bottom: 14px;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(251, 191, 36, 0.14);
    }

    .brand-title {
      font-size: 25px;
      font-weight: 800;
      color: var(--accent-gold);
      margin-bottom: 4px;
    }

    .brand-services {
      font-size: 16px;
      font-weight: 600;
      color: #fde68a;
      margin-bottom: 4px;
    }

    .brand-engineer {
      font-size: 15px;
      font-weight: 600;
      color: #f5f5f4;
      margin-bottom: 8px;
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      color: #fde68a;
      font-size: 13px;
      font-weight: 600;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .phone-box {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      border-radius: 999px;
      background: rgba(217, 119, 6, 0.16);
      border: 1px solid rgba(251, 191, 36, 0.25);
      color: #fafaf9;
      font-size: 13px;
      font-weight: 600;
      direction: ltr;
    }

    .console-wrap {
      background: var(--console-bg);
      border: 1px solid rgba(251, 191, 36, 0.16);
      border-radius: 12px;
      overflow: hidden;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(251, 191, 36, 0.04);
      border-bottom: 1px solid rgba(251, 191, 36, 0.1);
      font-size: 12px;
      color: var(--text-muted);
    }

    #console {
      font-family: 'logging', monospace;
      font-size: 15px;
      line-height: 1.5;
      color: #f5f5f4;
      text-align: left;
      direction: ltr;
      padding: 14px 16px;
      white-space: pre-wrap;
      word-break: break-word;
      height: 255px;
      overflow-y: auto;
    }

    .footer-note {
      margin-top: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-note a {
      color: var(--accent-gold);
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <script>
    if (window.applicationCache && window.applicationCache.status === 0) {
      window.location.replace("cache.html");
    }
  </script>

  <main class="shell">
    <header class="brand-header">
      <div class="brand-title">آلمنسي لخدمات البلايستيشن والموبايل</div>
      <div class="brand-services">بيع-صيانة-ألعاب</div>
      <div class="brand-engineer">م/ محمد المنسي</div>

      <div class="meta-row">
        <span class="pill">
          <span class="dot"></span>
          تعديلة إصدار سوفت وير 9
        </span>
        <span class="phone-box" id="phone-number">📞 01065670546</span>
      </div>
    </header>

    <section class="console-wrap" aria-label="سجل التنفيذ">
      <div class="console-header">
        <span>سجل التنفيذ</span>
        <span id="payload-status">جاري تحميل البيلود...</span>
      </div>
      <pre id="console"></pre>
    </section>

    <div class="footer-note">
      <span>تعديلة إصدار سوفت وير 9 • ترخيص تم التصميم بواسطه م/محمد المنسي</span>
      <a href="./about.html">المصدر والحقوق</a>
    </div>
  </main>

  <script src="payload.js"></script>
  <script type="module" src="./alert.mjs"></script>
</body>
</html>
