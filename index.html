<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PSFree - Lapse Exploit for 9.00</title>
  <style>
    :root {
      --bg-dark: #070b14;
      --bg-card: rgba(13, 19, 34, 0.9);
      --console-bg: #05080f;
      --border: rgba(96, 165, 250, 0.22);
      --accent: #3b82f6;
      --accent-soft: rgba(59, 130, 246, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    @font-face {
      font-family: 'logging';
      src: url('fonts/LiberationMono-Regular.ttf');
      font-display: swap;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(6, 63, 171, 0.35), rgba(7, 11, 20, 0.92) 55%),
        url('icon0 (1).jpg') center / cover no-repeat fixed;
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow: hidden;
    }

    .shell {
      width: 100%;
      max-width: 780px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 45px rgba(0, 0, 0, 0.55);
      padding: 24px 26px;
    }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: 999px;
      background: var(--accent-soft);
      border: 1px solid var(--border);
      color: #bfdbfe;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--success);
    }

    .meta {
      font-size: 13px;
      color: var(--text-muted);
    }

    h1 {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 0.2px;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 18px;
    }

    .console-wrap {
      background: var(--console-bg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      overflow: hidden;
    }

    .console-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 14px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      font-size: 12px;
      color: var(--text-muted);
    }

    #console {
      font-family: 'logging', monospace;
      font-size: 15px;
      line-height: 1.5;
      color: #e2e8f0;
      text-align: left;
      padding: 16px;
      white-space: pre-wrap;
      word-break: break-word;
      height: 280px;
      overflow-y: auto;
    }

    .footer-note {
      margin-top: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      color: var(--text-muted);
    }

    .footer-note a {
      color: #93c5fd;
      text-decoration: none;
    }

    .footer-note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <script>
    if (window.applicationCache && window.applicationCache.status === 0) {
      window.location.replace("cache.html");
    }
  </script>

  <main class="shell">
    <div class="top-bar">
      <span class="badge">
        <span class="dot"></span>
        PSFree + Lapse • FW 9.00
      </span>
      <span class="meta">MedoElmansy • م. محمد المنسي</span>
    </div>

    <h1>PSFree - Lapse Exploit for Firmware 9.00</h1>
    <p class="subtitle">Lightweight interface tuned for fast loading and smooth execution.</p>

    <section class="console-wrap" aria-label="Exploit log">
      <div class="console-header">
        <span>EXECUTION LOG</span>
        <span id="payload-status">Loading payload...</span>
      </div>
      <pre id="console"></pre>
    </section>

    <div class="footer-note">
      <span>Licensed under GNU AGPL-3.0-or-later</span>
      <a href="./about.html">Source &amp; Credits</a>
    </div>
  </main>

  <script src="payload.js"></script>
  <script type="module" src="./alert.mjs"></script>
</body>
</html>
