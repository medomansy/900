<html manifest="psfree_lapse.cache" lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تثبيت الكاش - تعديلة إصدار سوفت وير 9</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background:
        linear-gradient(135deg, rgba(180, 83, 9, 0.28), rgba(12, 11, 9, 0.92)),
        url('icon0 (1).jpg') center / cover no-repeat;
      color: #fafaf9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Tahoma, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      padding: 24px;
    }

    .box {
      background: rgba(20, 18, 15, 0.92);
      border: 1px solid rgba(251, 191, 36, 0.3);
      border-radius: 16px;
      padding: 28px 36px;
      text-align: center;
      max-width: 640px;
      width: 100%;
    }

    .info {
      font-size: 24px;
      font-weight: 600;
      color: #fbbf24;
      -webkit-font-feature-settings: "tnum";
      font-feature-settings: "tnum";
    }
  </style>
  <script>
    history.replaceState(null, null, 'index.html');
    var histlength = history.length;
    history.go(-histlength);

    function DLProgress(e) {
      var percent = e.total ? Math.round((e.loaded / e.total) * 100) : 0;
      msgs.innerHTML = "جاري تثبيت الكاش الأوفلاين ... " + percent + "%";
    }

    function DisplayCacheProgress() {
      setTimeout(function () {
        msgs.innerHTML = "تم تثبيت الكاش بنجاح";
      }, 1500);
      setTimeout(function () {
        location.reload();
      }, 2500);
    }

    if (window.applicationCache) {
      window.applicationCache.addEventListener("progress", DLProgress, false);
      window.applicationCache.oncached = DisplayCacheProgress;
      window.applicationCache.onupdateready = DisplayCacheProgress;
    }
  </script>
</head>
<body>
  <div class="box">
    <div id="msgs" class="info">جاري تجهيز الكاش الأوفلاين ...</div>
  </div>
</body>
</html>
